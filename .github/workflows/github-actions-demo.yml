name: Frontend quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run quality

      - name: Validate public OpenAPI contract
        if: ${{ vars.OPENAPI_URL != '' }}
        env:
          OPENAPI_URL: ${{ vars.OPENAPI_URL }}
        run: npm run contract:check